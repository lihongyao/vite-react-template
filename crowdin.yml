# Crowdin 项目配置
# 该仓库约定固定使用 Crowdin main 分支。

project_id: <project_id>
api_token: <api_token>

base_path: .
preserve_hierarchy: true

files:
  - source: /src/i18n/source/*.json
    translation: /src/i18n/downloads/%locale%/%original_file_name%
    languages_mapping:
      locale:
        en: en-US
        pt-BR: pt
        es-MX: es

branch: main
